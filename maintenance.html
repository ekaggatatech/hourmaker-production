<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>HourMaker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --hm-blue: #3e5ecc;
        --hm-ink: #1a2340;
        --hm-muted: #5c677a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: 'Poppins', 'Segoe UI', sans-serif;
        color: var(--hm-ink);
        background:
          radial-gradient(ellipse 80% 60% at 20% 10%, rgba(62, 94, 204, 0.18), transparent 55%),
          radial-gradient(ellipse 70% 50% at 90% 90%, rgba(62, 94, 204, 0.12), transparent 50%),
          linear-gradient(160deg, #eef2fb 0%, #f7f8fc 45%, #e8edf8 100%);
      }
      main {
        width: min(28rem, 100%);
        text-align: center;
        padding: 2.5rem 2rem;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(62, 94, 204, 0.12);
        border-radius: 1rem;
        box-shadow: 0 18px 40px rgba(26, 35, 64, 0.08);
      }
      .brand {
        margin: 0 0 1.25rem;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--hm-blue);
      }
      h1 {
        margin: 0 0 0.85rem;
        font-size: clamp(1.6rem, 4vw, 2rem);
        font-weight: 600;
      }
      p {
        margin: 0 0 1rem;
        font-size: 1rem;
        line-height: 1.55;
        color: var(--hm-muted);
      }
      .hint {
        margin: 0;
        font-size: 0.875rem;
        color: #7a8499;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">HourMaker</p>
      <h1>Temporarily unavailable</h1>
      <p>
        HourMaker is briefly unavailable. Please check back shortly.
      </p>
      <p class="hint">Please try again in a little while.</p>
    </main>
  </body>
</html>
